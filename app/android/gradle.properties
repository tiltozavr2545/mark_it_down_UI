org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# receive_sharing_intent и ряд других плагинов объявляют Java 1.8 в своём
# build.gradle, а Kotlin-таск под JDK 21 (bundled с Android Studio) целится
# в 21 — несовпадение само по себе не ошибка выполнения, просто строгая
# проверка Kotlin Gradle-плагина. Понижаем её до warning, не трогая код
# плагинов (он не наш).
kotlin.jvm.target.validation.mode=warning
