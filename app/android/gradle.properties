org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# receive_sharing_intent and a number of other plugins declare Java 1.8 in
# their build.gradle, while the Kotlin task under JDK 21 (bundled with
# Android Studio) targets 21 — the mismatch isn't a runtime error by
# itself, just a strict check from the Kotlin Gradle plugin. We lower it to
# a warning, without touching the plugins' code (it's not ours).
kotlin.jvm.target.validation.mode=warning
