name: CI

on:
  push:
    # Только ветки: теги v* собирает release.yml, который зовёт этот же
    # workflow через workflow_call — без фильтра тег гонял бы всё дважды.
    branches: ['**']
  pull_request:
  workflow_call:

env:
  FLUTTER_VERSION: 3.32.8

jobs:
  verify:
    # Не ubuntu-latest: с 19.10.2026 он переезжает на Ubuntu 26, а отсюда
    # берётся Tesseract из пакетов дистрибутива — его версия попадает в
    # ожидания OCR-тестов. Поднимать осознанно, как windows-2022 ниже.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # OCR-тесты (core/test/ocr_test.dart) — на Tesseract из пакетов Ubuntu:
      # Linux не целевая платформа, и собирать его здесь из исходников
      # (tesseract/build.sh, минуты) незачем. Модели — свои, закреплённые,
      # их качает make test (tesseract/fetch.sh).
      - name: Tesseract (пакет дистрибутива)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libtesseract5

      # Распознавание речи (0.8): whisper.cpp собирается из исходников
      # (whisper/build.sh, минуты — десяток вариантов CPU-бэкенда), модели
      # качает fetch.sh (265 МБ). И то и другое кэшируется по хешу рецепта;
      # с ними make test гоняет core/test/speech_test.dart, без них —
      # пропускает.
      - uses: actions/cache@v6
        with:
          path: |
            whisper/native/host
            whisper/cache
          key: whisper-linux-x64-${{ hashFiles('whisper/build.sh', 'whisper/versions.sh', 'whisper/shim/**') }}

      - uses: actions/cache@v6
        with:
          path: whisper/models
          key: whisper-models-${{ hashFiles('whisper/versions.sh') }}

      - name: whisper (сборка и модели)
        run: |
          ./whisper/build.sh
          ./whisper/fetch.sh

      - name: make verify
        run: make verify

      # Бамп версии обязателен в каждом PR (docs/operations.md#версия). Только
      # на pull_request: на push в main сравнивать не с чем. checkout берёт один
      # коммит, поэтому базовую ветку подтягиваем явно.
      - name: бамп версии (app/pubspec.yaml)
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          make verify-version BASE_REF="origin/$BASE_BRANCH"

      # Сеть в приложении — только режим «ссылка», и только через dart:io в
      # core/lib/src/web/ (docs/offline-and-privacy.md). Сетевой пакет —
      # это сеть мимо этого модуля: ловим его, как только он приезжает
      # транзитивно, а не когда их наберётся тридцать.
      #
      # web_socket_channel/http_parser/http_multi_server/shelf* сюда не
      # попадают намеренно: это внутренняя инфраструктура package:test,
      # которую тянет riverpod (прямая, не dev-зависимость, см. его
      # pubspec.yaml) — тестовый раннер, а не сетевой клиент приложения.
      - name: нет сетевых пакетов в зависимостях app/
        working-directory: app
        run: |
          if dart pub deps --no-dev --style=list | grep -E '^- (http|dio|grpc|sentry|firebase)[^a-zA-Z0-9_]'; then
            echo "::error::Найден сетевой пакет в зависимостях app/"
            exit 1
          fi

      - name: нет сетевых пакетов в зависимостях core/
        working-directory: core
        run: |
          if dart pub deps --no-dev --style=list | grep -E '^- (http|dio|grpc|sentry|firebase)[^a-zA-Z0-9_]'; then
            echo "::error::Найден сетевой пакет в зависимостях core/"
            exit 1
          fi

      # С 0.9 у APK есть INTERNET (режим «ссылка»), и гарантия держится на
      # коде: сокеты и HTTP-клиент — только в core/lib/src/web/, где сеть
      # ходит лишь по ссылке, которую дал человек. Новое место с сетью —
      # осознанное решение с правкой этого шага, а не мимоходом.
      - name: сеть только в core/lib/src/web/
        run: |
          if grep -rnE '\b(HttpClient|HttpServer|HttpOverrides|Socket|RawSocket|SecureSocket|ServerSocket|RawDatagramSocket|WebSocket|InternetAddress|NetworkInterface)\b' \
               app/lib core/lib --include='*.dart' | grep -v '^core/lib/src/web/'; then
            echo "::error::Сетевой код вне core/lib/src/web/"
            exit 1
          fi

      # macOS: в Release только исходящие соединения (network.client) —
      # входящих (network.server) нет, песочница включена. Сайдкару сеть не
      # нужна вовсе: его собственные entitlements без network.*.
      - name: в Release.entitlements нет network.server, у сайдкара нет сети
        run: |
          if grep -q '<key>com.apple.security.network.server' app/macos/Runner/Release.entitlements; then
            echo "::error::Входящие соединения (network.server) в Release.entitlements"
            exit 1
          fi
          if grep -q '<key>com.apple.security.network' sidecar/*.entitlements; then
            echo "::error::Сетевой entitlement в sidecar/*.entitlements"
            exit 1
          fi
          if ! grep -A1 '<key>com.apple.security.app-sandbox</key>' app/macos/Runner/Release.entitlements | grep -q '<true/>'; then
            echo "::error::В Release.entitlements выключен app-sandbox"
            exit 1
          fi

      # Windows-часть приложения (Этап 5, п. 7). По импортам .exe сеть не
      # проверить — flutter_windows.dll и Dart VM сами тянут сокеты для
      # отладочного сервиса, такая проверка всегда красная. Честно проверяемо
      # только то, что мы сами не добавили сетевых библиотек в runner/CMake:
      # гарантии уровня ОС у zip-сборки нет (docs/offline-and-privacy.md).
      - name: нет сетевых библиотек в app/windows/
        run: |
          if grep -rniE 'ws2_32|winhttp|wininet|urlmon|winsock|internetClient' app/windows/ --exclude-dir=ephemeral; then
            echo "::error::В app/windows/ появилась сетевая библиотека или capability"
            exit 1
          fi

  # Python-сайдкар под Windows (Этап 5, п. 4). Собирать его, кроме как здесь,
  # негде. Не часть make verify (как и на Mac): качает сотни МБ, поэтому
  # результат кэшируется по хешу всего, от чего он зависит.
  #
  # Lock-файл генерируется только здесь (хеши колёс win_amd64 свои), а
  # коммитится руками после чтения: если sidecar/locks/windows-x86_64.txt
  # в репозитории нет, джоб создаёт его lock.sh, выкладывает артефактом
  # sidecar-lock-windows-x86_64, собирает по нему и в конце КРАСНЕЕТ — чтобы
  # незакреплённый эталон не сошёл за нормальное состояние.
  windows-sidecar:
    runs-on: windows-2022  # тот же образ, что у windows, — см. там
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: |
            sidecar/dist/windows-x86_64
            sidecar/cache
          key: sidecar-windows-x86_64-${{ hashFiles('sidecar/common.sh', 'sidecar/build.sh', 'sidecar/run.py', 'sidecar/locks/windows-x86_64.txt') }}

      - name: lock-файл (если его нет в репозитории)
        id: lock
        run: |
          if [[ -f sidecar/locks/windows-x86_64.txt ]]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            ./sidecar/lock.sh
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.lock.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-lock-windows-x86_64
          path: sidecar/locks/windows-x86_64.txt

      - name: сборка сайдкара
        run: ./sidecar/build.sh

      # Лимит 260 символов: самый длинный путь внутри сайдкара плюс запас на
      # каталог, куда его распакуют (C:\Users\<имя>\Downloads\…\sidecar\ —
      # берём 100). Не падение, а цифра в логе: длинные пути на машине автора
      # проверяются в п. 8.
      - name: самый длинный путь в сайдкаре
        run: |
          cd sidecar/dist/windows-x86_64
          # awk, а не head: head закрывает пайп раньше, sort получает SIGPIPE,
          # и под pipefail шаг падает с кодом 141.
          find . -type f | awk '{ print length($0) - 2, $0 }' | sort -rn | awk 'NR <= 3'

      - name: PDFium (pdfium.dll)
        run: ./pdfium/fetch.sh

      - name: интеграционные тесты и сверка с Dart-ядром
        run: |
          export MARKITDOWN_PDFIUM_PATH="$(cygpath -w "$PWD/pdfium/native/host/pdfium.dll")"
          export MARKITDOWN_SIDECAR_DIR="$(cygpath -w "$PWD/sidecar/dist/windows-x86_64")"
          cd core
          dart pub get
          dart test test/sidecar_integration_test.dart
          dart run tool/compare_sidecar.dart
          cat build/sidecar-compare/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sidecar-compare-windows-x86_64
          path: core/build/sidecar-compare
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-windows-x86_64
          path: sidecar/dist/windows-x86_64
          if-no-files-found: error

      - name: lock-файл закоммичен?
        if: steps.lock.outputs.generated == 'true'
        run: |
          echo "::error::sidecar/locks/windows-x86_64.txt нет в репозитории. Скачать артефакт sidecar-lock-windows-x86_64, прочитать и закоммитить."
          exit 1

  # Windows собирается только на Windows (docs/implementation-plan.md, Этап 5):
  # здесь — и проверка, и сборка, артефакт которой автор запускает руками.
  #
  # Ждёт windows-sidecar, но не зависит от его успеха: сайдкар собрался —
  # кладётся рядом с .exe (install в app/windows/CMakeLists.txt), нет —
  # выходит Dart-only сборка, а проверки Dart-части всё равно прогоняются.
  #
  # Шаги — эквивалент `make verify`, расписанный вручную, а не `make`: в Git
  # Bash раннера make нет, а Makefile знает только Darwin/Linux. Список
  # проверок поэтому живёт в двух местах — Makefile и этот джоб; при правке
  # одного держать одинаковым другой (то же сказано у `verify` в Makefile).
  windows:
    needs: windows-sidecar
    if: always()
    # Не windows-latest и не windows-2025: с осени 2026 оба — образ
    # windows-2025-vs2026, а Flutter 3.32.8 (закреплён, см. AGENTS.md) знает
    # Visual Studio только до 2022 и для неизвестной версии подставляет
    # генератор «Visual Studio 16 2019» — CMake падает с «could not find any
    # instance of Visual Studio». windows-2022 — образ с VS 2022. Поднимать
    # вместе с Flutter.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Без .gitattributes (eol=lf) этот шаг упал бы на CRLF при чекауте —
      # проверяем, что правило действительно сработало.
      - name: переводы строк — LF
        run: |
          if git ls-files --eol | grep -E '^i/lf +w/crlf'; then
            echo "::error::Файлы выписаны с CRLF — проверить .gitattributes"
            exit 1
          fi

      - name: pub get
        run: |
          (cd app && flutter pub get)
          (cd core && dart pub get)

      - name: format
        run: |
          (cd app && dart format --set-exit-if-changed .)
          (cd core && dart format --set-exit-if-changed .)

      - name: analyze
        run: |
          (cd app && flutter analyze)
          (cd core && dart analyze)

      - name: PDFium (pdfium.dll)
        run: ./pdfium/fetch.sh

      # Tesseract для OCR (Этап 6): DLL собираются из исходников
      # (tesseract/build.sh, ~10 минут) и кэшируются по хешу рецепта; модели
      # и Android-.so качает fetch.sh — секунды. DLL нужны и тестам, и
      # flutter build windows (install в app/windows/CMakeLists.txt).
      - uses: actions/cache@v6
        with:
          path: |
            tesseract/native/host
            tesseract/cache
          key: tesseract-windows-x64-${{ hashFiles('tesseract/build.sh', 'tesseract/versions.sh') }}

      - name: Tesseract (сборка DLL и модели)
        run: |
          ./tesseract/build.sh
          ./tesseract/fetch.sh
          ls -la tesseract/native/host

      # Распознавание речи (0.8): DLL whisper.cpp — из исходников, как
      # Tesseract, с кэшем по хешу рецепта; модели — fetch.sh. Нужны и
      # тестам, и flutter build windows (install в app/windows/CMakeLists.txt).
      # Здесь же единственная в CI проверка AAC (M4A через Media
      # Foundation): на Linux декодера платформы нет.
      - uses: actions/cache@v6
        with:
          path: |
            whisper/native/host
            whisper/cache
          key: whisper-windows-x64-${{ hashFiles('whisper/build.sh', 'whisper/versions.sh', 'whisper/shim/**') }}

      - uses: actions/cache@v6
        with:
          path: whisper/models
          key: whisper-models-${{ hashFiles('whisper/versions.sh') }}

      - name: whisper (сборка DLL и модели)
        run: |
          ./whisper/build.sh
          ./whisper/fetch.sh

      - name: test
        run: |
          (cd app && flutter test)
          export MARKITDOWN_PDFIUM_PATH="$(cygpath -w "$PWD/pdfium/native/host/pdfium.dll")"
          export MARKITDOWN_TESSERACT_DIR="$(cygpath -w "$PWD/tesseract/native/host")"
          export MARKITDOWN_WHISPER_DIR="$(cygpath -w "$PWD/whisper/native/host")"
          (cd core && dart test)

      - name: сайдкар из windows-sidecar
        if: needs.windows-sidecar.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: sidecar-windows-x86_64
          path: sidecar/dist/windows-x86_64

      - name: flutter build windows
        working-directory: app
        run: flutter build windows --release

      - name: что в сборке
        run: |
          cd app/build/windows/x64/runner/Release
          ls tesseract*.dll leptonica*.dll data/flutter_assets/assets/tessdata/
          ls markitdown_whisper.dll whisper.dll ggml*.dll data/flutter_assets/assets/whisper/
          if [[ -f sidecar/manifest.json ]]; then
            echo "Сборка **с сайдкаром**: $(du -sh . | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Сборка **без сайдкара** (Dart-only): $(du -sh . | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls

      # Пока упаковка — zip (Этап 5, п. 6: «zip сейчас, решить позже»):
      # upload-artifact сам отдаёт каталог zip-архивом. Распаковал и
      # запустил markitdown_ui.exe — ничего не ставится.
      - uses: actions/upload-artifact@v7
        with:
          name: markitdown_ui-windows-x64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error
