name: CI

on:
  push:
    # Branches only: tags v* are built by release.yml, which calls this same
    # workflow via workflow_call — without the filter the tag would run it all twice.
    branches: ['**']
  pull_request:
  workflow_call:

env:
  FLUTTER_VERSION: 3.32.8

jobs:
  verify:
    # Not ubuntu-latest: on 19.10.2026 it moves to Ubuntu 26, and that is where
    # Tesseract comes from as a distro package — its version feeds the OCR
    # test expectations. Bump it deliberately, like windows-2022 below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # OCR tests (core/test/ocr_test.dart) run against Tesseract from Ubuntu
      # packages: Linux isn't a target platform, so there's no point building
      # it from source here (tesseract/build.sh, minutes). The models are our
      # own, pinned, and make test downloads them (tesseract/fetch.sh).
      - name: Tesseract (пакет дистрибутива)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libtesseract5

      # Speech recognition (0.8): whisper.cpp is built from source
      # (whisper/build.sh, minutes — a dozen CPU-backend variants), the models
      # are downloaded by fetch.sh (265 MB). Both are cached by recipe hash;
      # with them make test runs core/test/speech_test.dart, without them it
      # skips it.
      - uses: actions/cache@v6
        with:
          path: |
            whisper/native/host
            whisper/cache
          key: whisper-linux-x64-${{ hashFiles('whisper/build.sh', 'whisper/versions.sh', 'whisper/shim/**') }}

      - uses: actions/cache@v6
        with:
          path: whisper/models
          key: whisper-models-${{ hashFiles('whisper/versions.sh') }}

      - name: whisper (сборка и модели)
        run: |
          ./whisper/build.sh
          ./whisper/fetch.sh

      - name: make verify
        run: make verify

      # A version bump is required in every PR (docs/operations.md#version).
      # Only on pull_request: there's nothing to compare against on push to
      # main. checkout takes a single commit, so we fetch the base branch
      # explicitly.
      - name: бамп версии (app/pubspec.yaml)
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          make verify-version BASE_REF="origin/$BASE_BRANCH"

      # Networking in the app is "link" mode only, and only through dart:io
      # in core/lib/src/web/ (docs/offline-and-privacy.md). A networking
      # package is network access bypassing that module: catch it as soon as
      # it arrives transitively, not once there are thirty of them.
      #
      # web_socket_channel/http_parser/http_multi_server/shelf* are
      # deliberately excluded: they're internal infrastructure for
      # package:test, pulled in by riverpod (a direct, non-dev dependency,
      # see its pubspec.yaml) — a test runner, not the app's network client.
      - name: нет сетевых пакетов в зависимостях app/
        working-directory: app
        run: |
          if dart pub deps --no-dev --style=list | grep -E '^- (http|dio|grpc|sentry|firebase)[^a-zA-Z0-9_]'; then
            echo "::error::Найден сетевой пакет в зависимостях app/"
            exit 1
          fi

      - name: нет сетевых пакетов в зависимостях core/
        working-directory: core
        run: |
          if dart pub deps --no-dev --style=list | grep -E '^- (http|dio|grpc|sentry|firebase)[^a-zA-Z0-9_]'; then
            echo "::error::Найден сетевой пакет в зависимостях core/"
            exit 1
          fi

      # As of 0.9 the APK has INTERNET ("link" mode), and the guarantee rests
      # on the code: sockets and the HTTP client live only in
      # core/lib/src/web/, where network access only follows a link the
      # human gave. A new place with networking is a deliberate decision
      # with an edit to this step, not something that slips in.
      - name: сеть только в core/lib/src/web/
        run: |
          if grep -rnE '\b(HttpClient|HttpServer|HttpOverrides|Socket|RawSocket|SecureSocket|ServerSocket|RawDatagramSocket|WebSocket|InternetAddress|NetworkInterface)\b' \
               app/lib core/lib --include='*.dart' | grep -v '^core/lib/src/web/'; then
            echo "::error::Сетевой код вне core/lib/src/web/"
            exit 1
          fi

      # macOS: in Release only outgoing connections (network.client) —
      # no incoming (network.server), sandbox enabled. The sidecar needs no
      # networking at all: its own entitlements have no network.*.
      - name: в Release.entitlements нет network.server, у сайдкара нет сети
        run: |
          if grep -q '<key>com.apple.security.network.server' app/macos/Runner/Release.entitlements; then
            echo "::error::Входящие соединения (network.server) в Release.entitlements"
            exit 1
          fi
          if grep -q '<key>com.apple.security.network' sidecar/*.entitlements; then
            echo "::error::Сетевой entitlement в sidecar/*.entitlements"
            exit 1
          fi
          if ! grep -A1 '<key>com.apple.security.app-sandbox</key>' app/macos/Runner/Release.entitlements | grep -q '<true/>'; then
            echo "::error::В Release.entitlements выключен app-sandbox"
            exit 1
          fi

      # The Windows part of the app (Stage 5, item 7). Networking can't be
      # checked from the .exe's imports — flutter_windows.dll and the Dart VM
      # themselves pull in sockets for the debug service, so that check would
      # always be red. The only thing honestly checkable is that we ourselves
      # haven't added networking libraries to runner/CMake: a zip build has
      # no OS-level guarantee (docs/offline-and-privacy.md).
      - name: нет сетевых библиотек в app/windows/
        run: |
          if grep -rniE 'ws2_32|winhttp|wininet|urlmon|winsock|internetClient' app/windows/ --exclude-dir=ephemeral; then
            echo "::error::В app/windows/ появилась сетевая библиотека или capability"
            exit 1
          fi

  # The Python sidecar for Windows (Stage 5, item 4). There's nowhere else to
  # build it. Not part of make verify (same as on Mac): it downloads
  # hundreds of MB, so the result is cached by the hash of everything it
  # depends on.
  #
  # The lock file is generated only here (win_amd64 wheel hashes are its
  # own) and committed by hand after review: if
  # sidecar/locks/windows-x86_64.txt isn't in the repository, the job
  # creates it with lock.sh, uploads it as the sidecar-lock-windows-x86_64
  # artifact, builds against it, and TURNS RED at the end — so an unpinned
  # reference doesn't pass for a normal state.
  windows-sidecar:
    runs-on: windows-2022  # same image as windows — see there
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: |
            sidecar/dist/windows-x86_64
            sidecar/cache
          key: sidecar-windows-x86_64-${{ hashFiles('sidecar/common.sh', 'sidecar/build.sh', 'sidecar/run.py', 'sidecar/locks/windows-x86_64.txt') }}

      - name: lock-файл (если его нет в репозитории)
        id: lock
        run: |
          if [[ -f sidecar/locks/windows-x86_64.txt ]]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            ./sidecar/lock.sh
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.lock.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-lock-windows-x86_64
          path: sidecar/locks/windows-x86_64.txt

      - name: сборка сайдкара
        run: ./sidecar/build.sh

      # Limit of 260 characters: the longest path inside the sidecar plus
      # headroom for the directory it gets unpacked into
      # (C:\Users\<name>\Downloads\…\sidecar\ — we budget 100). Not a
      # failure, just a number in the log: long paths on the author's own
      # machine are checked in item 8.
      - name: самый длинный путь в сайдкаре
        run: |
          cd sidecar/dist/windows-x86_64
          # awk, not head: head closes the pipe early, sort gets SIGPIPE,
          # and under pipefail the step fails with exit code 141.
          find . -type f | awk '{ print length($0) - 2, $0 }' | sort -rn | awk 'NR <= 3'

      - name: PDFium (pdfium.dll)
        run: ./pdfium/fetch.sh

      - name: интеграционные тесты и сверка с Dart-ядром
        run: |
          export MARKITDOWN_PDFIUM_PATH="$(cygpath -w "$PWD/pdfium/native/host/pdfium.dll")"
          export MARKITDOWN_SIDECAR_DIR="$(cygpath -w "$PWD/sidecar/dist/windows-x86_64")"
          cd core
          dart pub get
          dart test test/sidecar_integration_test.dart
          dart run tool/compare_sidecar.dart
          cat build/sidecar-compare/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sidecar-compare-windows-x86_64
          path: core/build/sidecar-compare
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-windows-x86_64
          path: sidecar/dist/windows-x86_64
          if-no-files-found: error

      - name: lock-файл закоммичен?
        if: steps.lock.outputs.generated == 'true'
        run: |
          echo "::error::sidecar/locks/windows-x86_64.txt нет в репозитории. Скачать артефакт sidecar-lock-windows-x86_64, прочитать и закоммитить."
          exit 1

  # Windows is only built on Windows (docs/implementation-plan.md, Stage 5):
  # both the check and the build happen here, and the author runs its
  # artifact by hand.
  #
  # Waits on windows-sidecar, but doesn't depend on its success: if the
  # sidecar built, it's placed next to the .exe (install in
  # app/windows/CMakeLists.txt); if not, it's a Dart-only build, and the
  # Dart-side checks still run either way.
  #
  # The steps are the equivalent of `make verify`, spelled out by hand
  # rather than via `make`: the runner's Git Bash has no make, and the
  # Makefile only knows Darwin/Linux. The list of checks therefore lives in
  # two places — the Makefile and this job; when editing one, keep the
  # other in sync (the same is said next to `verify` in the Makefile).
  windows:
    needs: windows-sidecar
    if: always()
    # Not windows-latest and not windows-2025: as of fall 2026 both are the
    # windows-2025-vs2026 image, and Flutter 3.32.8 (pinned, see AGENTS.md)
    # only knows Visual Studio up to 2022 and falls back to the "Visual
    # Studio 16 2019" generator for an unknown version — CMake then fails
    # with "could not find any instance of Visual Studio". windows-2022 is
    # the image with VS 2022. Bump it together with Flutter.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Without .gitattributes (eol=lf) this step would fail on CRLF at
      # checkout — we're verifying the rule actually took effect.
      - name: переводы строк — LF
        run: |
          if git ls-files --eol | grep -E '^i/lf +w/crlf'; then
            echo "::error::Файлы выписаны с CRLF — проверить .gitattributes"
            exit 1
          fi

      - name: pub get
        run: |
          (cd app && flutter pub get)
          (cd core && dart pub get)

      - name: format
        run: |
          (cd app && dart format --set-exit-if-changed .)
          (cd core && dart format --set-exit-if-changed .)

      - name: analyze
        run: |
          (cd app && flutter analyze)
          (cd core && dart analyze)

      - name: PDFium (pdfium.dll)
        run: ./pdfium/fetch.sh

      # Tesseract for OCR (Stage 6): the DLLs are built from source
      # (tesseract/build.sh, ~10 minutes) and cached by recipe hash; the
      # models and Android .so are downloaded by fetch.sh — seconds. The
      # DLLs are needed by both the tests and flutter build windows (install
      # in app/windows/CMakeLists.txt).
      - uses: actions/cache@v6
        with:
          path: |
            tesseract/native/host
            tesseract/cache
          key: tesseract-windows-x64-${{ hashFiles('tesseract/build.sh', 'tesseract/versions.sh') }}

      - name: Tesseract (сборка DLL и модели)
        run: |
          ./tesseract/build.sh
          ./tesseract/fetch.sh
          ls -la tesseract/native/host

      # Speech recognition (0.8): the whisper.cpp DLL — from source, like
      # Tesseract, cached by recipe hash; models via fetch.sh. Needed by both
      # the tests and flutter build windows (install in
      # app/windows/CMakeLists.txt). This is also CI's only check of AAC
      # (M4A via Media Foundation): Linux has no platform decoder for it.
      - uses: actions/cache@v6
        with:
          path: |
            whisper/native/host
            whisper/cache
          key: whisper-windows-x64-${{ hashFiles('whisper/build.sh', 'whisper/versions.sh', 'whisper/shim/**') }}

      - uses: actions/cache@v6
        with:
          path: whisper/models
          key: whisper-models-${{ hashFiles('whisper/versions.sh') }}

      - name: whisper (сборка DLL и модели)
        run: |
          ./whisper/build.sh
          ./whisper/fetch.sh

      - name: test
        run: |
          (cd app && flutter test)
          export MARKITDOWN_PDFIUM_PATH="$(cygpath -w "$PWD/pdfium/native/host/pdfium.dll")"
          export MARKITDOWN_TESSERACT_DIR="$(cygpath -w "$PWD/tesseract/native/host")"
          export MARKITDOWN_WHISPER_DIR="$(cygpath -w "$PWD/whisper/native/host")"
          (cd core && dart test)

      - name: сайдкар из windows-sidecar
        if: needs.windows-sidecar.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: sidecar-windows-x86_64
          path: sidecar/dist/windows-x86_64

      - name: flutter build windows
        working-directory: app
        run: flutter build windows --release

      - name: что в сборке
        run: |
          cd app/build/windows/x64/runner/Release
          ls tesseract*.dll leptonica*.dll data/flutter_assets/assets/tessdata/
          ls markitdown_whisper.dll whisper.dll ggml*.dll data/flutter_assets/assets/whisper/
          if [[ -f sidecar/manifest.json ]]; then
            echo "Сборка **с сайдкаром**: $(du -sh . | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Сборка **без сайдкара** (Dart-only): $(du -sh . | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls

      # Packaging is a zip for now (Stage 5, item 6: "zip now, decide
      # later"): upload-artifact hands back the directory as a zip archive
      # on its own. Unzip and run markitdown_ui.exe — nothing to install.
      - uses: actions/upload-artifact@v7
        with:
          name: markitdown_ui-windows-x64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error
