name: Release

# Тег vX.Y.Z → GitHub Release с готовыми сборками для Windows и Android
# (docs/operations.md#релиз). Тег ставится на коммит в main, версия в
# app/pubspec.yaml должна совпадать с тегом — проверяется ниже.
#
#   git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ['v*']
  # Пробный прогон без публикации — когда меняется сам рецепт релиза:
  # иначе о сломанной сборке APK узнали бы уже после тега.
  pull_request:
    paths: ['.github/workflows/release.yml']

env:
  FLUTTER_VERSION: 3.32.8

jobs:
  # Те же проверки и та же Windows-сборка (с сайдкаром), что на каждом push:
  # релиз собирается ровно тем, что проверяет CI, а не отдельным рецептом.
  ci:
    uses: ./.github/workflows/ci.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: версия в pubspec совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | cut -d+ -f1)"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Тег v$tag, а в app/pubspec.yaml версия $version"
            exit 1
          fi

      # libpdfium.so в jniLibs/arm64-v8a — без неё APK собирается, но PDF
      # падает в рантайме (docs/operations.md#android).
      - name: PDFium
        run: ./pdfium/fetch.sh

      # Tesseract для OCR: libtesseract/libleptonica/libjpeg/libpngx.so в
      # jniLibs/arm64-v8a и модели rus/eng в assets/tessdata. Без них APK
      # собирается, но OCR в нём молча недоступен — проверяется ниже.
      - name: Tesseract (модели и .so)
        run: ./tesseract/fetch.sh

      # Только arm64: PDFium в APK лежит лишь под arm64-v8a, а других
      # телефонов практически не осталось. Подпись — debug-ключ (так
      # настроен android/app/build.gradle.kts, своего ключа пока нет).
      - name: flutter build apk
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      # Главная гарантия продукта — на собранном APK, а не только на
      # манифесте в исходниках (docs/offline-and-privacy.md): разрешения
      # приезжают и из манифестов зависимостей.
      - name: нет android.permission.INTERNET в APK
        run: |
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)"
          "$aapt" dump permissions app/build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "::error::APK запрашивает INTERNET"
            exit 1
          fi

      - name: OCR в APK
        run: |
          unzip -l app/build/app/outputs/flutter-apk/app-release.apk > apk.txt
          for f in lib/arm64-v8a/libtesseract.so lib/arm64-v8a/libleptonica.so \
                   assets/flutter_assets/assets/tessdata/rus.traineddata \
                   assets/flutter_assets/assets/tessdata/eng.traineddata; do
            grep -q "$f" apk.txt || { echo "::error::В APK нет $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: markitdown_ui-android-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    needs: [ci, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: markitdown_ui-windows-x64
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: markitdown_ui-android-arm64
          path: dist/android

      # Релиз без сайдкара на Windows — не тот продукт (xls/msg и таблицы PDF
      # пропадут молча), поэтому падаем, а не публикуем урезанную сборку.
      - name: файлы релиза
        run: |
          v="${GITHUB_REF_NAME#v}"
          test -f dist/windows/markitdown_ui.exe
          test -f dist/windows/pdfium.dll
          ls dist/windows/tesseract*.dll dist/windows/leptonica*.dll
          test -f dist/windows/data/flutter_assets/assets/tessdata/rus.traineddata
          test -f dist/windows/sidecar/manifest.json || {
            echo "::error::В Windows-сборке нет сайдкара"; exit 1; }
          # Внутри архива — одна папка, а не россыпь файлов в «Загрузках».
          mv dist/windows "dist/markitdown_ui-$v-windows-x64"
          (cd dist && zip -qr "markitdown_ui-$v-windows-x64.zip" "markitdown_ui-$v-windows-x64")
          mv dist/android/app-release.apk "dist/markitdown_ui-$v-android-arm64.apk"
          ls -la dist

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "MarkItDown UI $v" \
            --notes-file .github/release-notes.md \
            "dist/markitdown_ui-$v-windows-x64.zip" \
            "dist/markitdown_ui-$v-android-arm64.apk"
