name: Release

# Тег vX.Y.Z → GitHub Release с готовыми сборками для Windows и Android
# (docs/operations.md#релиз). Тег ставится на коммит в main, версия в
# app/pubspec.yaml должна совпадать с тегом — проверяется ниже.
#
#   git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ['v*']
  # Пробный прогон без публикации — когда меняется сам рецепт релиза:
  # иначе о сломанной сборке APK узнали бы уже после тега.
  pull_request:
    paths: ['.github/workflows/release.yml']

env:
  FLUTTER_VERSION: 3.32.8

jobs:
  # Те же проверки и та же Windows-сборка (с сайдкаром), что на каждом push:
  # релиз собирается ровно тем, что проверяет CI, а не отдельным рецептом.
  ci:
    uses: ./.github/workflows/ci.yml

  android:
    runs-on: ubuntu-24.04  # не ubuntu-latest — см. verify в ci.yml
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: версия в pubspec совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | cut -d+ -f1)"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Тег v$tag, а в app/pubspec.yaml версия $version"
            exit 1
          fi

      # libpdfium.so в jniLibs/arm64-v8a — без неё APK собирается, но PDF
      # падает в рантайме (docs/operations.md#android).
      - name: PDFium
        run: ./pdfium/fetch.sh

      # Tesseract для OCR: libtesseract/libleptonica/libjpeg/libpngx.so в
      # jniLibs/arm64-v8a и модели rus/eng в assets/tessdata. Без них APK
      # собирается, но OCR в нём молча недоступен — проверяется ниже.
      - name: Tesseract (модели и .so)
        run: ./tesseract/fetch.sh

      # Распознавание речи (0.8): .so собираются из исходников NDK той же
      # версии, что у приложения (whisper/versions.sh), — готовых нет, в
      # отличие от Tesseract4Android. Кэш — по хешу рецепта.
      - uses: actions/cache@v6
        with:
          path: |
            whisper/cache
            app/android/app/src/main/jniLibs/arm64-v8a/*whisper*
            app/android/app/src/main/jniLibs/arm64-v8a/*ggml*
            app/android/app/src/main/jniLibs/arm64-v8a/.whisper-built-*
          key: whisper-android-arm64-${{ hashFiles('whisper/build.sh', 'whisper/versions.sh', 'whisper/shim/**') }}

      - uses: actions/cache@v6
        with:
          path: whisper/models
          key: whisper-models-${{ hashFiles('whisper/versions.sh') }}

      - name: whisper (NDK, сборка .so и модели)
        run: |
          ndk="$(sed -n 's/^ANDROID_NDK_VERSION="\(.*\)"/\1/p' whisper/versions.sh)"
          # (yes || true): под pipefail yes, получив SIGPIPE, роняет шаг с 141.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          ./whisper/build.sh --android
          ./whisper/fetch.sh

      # Только arm64: PDFium в APK лежит лишь под arm64-v8a, а других
      # телефонов практически не осталось. Подпись — debug-ключ (так
      # настроен android/app/build.gradle.kts, своего ключа пока нет).
      - name: flutter build apk
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      # Разрешения — на собранном APK, а не только в манифесте исходников:
      # они приезжают и из манифестов зависимостей. С 0.9 INTERNET есть
      # (режим «ссылка», docs/offline-and-privacy.md); из сетевых больше
      # ничего — ни состояния сети, ни Wi-Fi: приложению они не нужны.
      - name: разрешения APK
        run: |
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)"
          "$aapt" dump permissions app/build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -qE 'android.permission.(ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)' permissions.txt; then
            echo "::error::APK запрашивает сетевое разрешение сверх INTERNET"
            exit 1
          fi

      - name: OCR и распознавание речи в APK
        run: |
          unzip -l app/build/app/outputs/flutter-apk/app-release.apk > apk.txt
          for f in lib/arm64-v8a/libtesseract.so lib/arm64-v8a/libleptonica.so \
                   assets/flutter_assets/assets/tessdata/rus.traineddata \
                   assets/flutter_assets/assets/tessdata/eng.traineddata \
                   lib/arm64-v8a/libmarkitdown_whisper.so lib/arm64-v8a/libwhisper.so \
                   lib/arm64-v8a/libggml-cpu-android_armv8.0_1.so \
                   assets/flutter_assets/assets/whisper/models.json \
                   assets/flutter_assets/assets/whisper/ggml-small-q8_0.bin; do
            grep -q "$f" apk.txt || { echo "::error::В APK нет $f"; exit 1; }
          done
          echo "APK: $(du -h app/build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: markitdown_ui-android-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    needs: [ci, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04  # не ubuntu-latest — см. verify в ci.yml
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: markitdown_ui-windows-x64
          path: dist/windows

      - uses: actions/download-artifact@v8
        with:
          name: markitdown_ui-android-arm64
          path: dist/android

      # Релиз без сайдкара на Windows — не тот продукт (таблицы PDF пропадут
      # молча, xls/msg уйдут запасному разбору), поэтому падаем, а не
      # публикуем урезанную сборку.
      - name: файлы релиза
        run: |
          v="${GITHUB_REF_NAME#v}"
          test -f dist/windows/markitdown_ui.exe
          test -f dist/windows/pdfium.dll
          ls dist/windows/tesseract*.dll dist/windows/leptonica*.dll
          test -f dist/windows/data/flutter_assets/assets/tessdata/rus.traineddata
          test -f dist/windows/markitdown_whisper.dll
          test -f dist/windows/data/flutter_assets/assets/whisper/models.json
          test -f dist/windows/sidecar/manifest.json || {
            echo "::error::В Windows-сборке нет сайдкара"; exit 1; }
          # Внутри архива — одна папка, а не россыпь файлов в «Загрузках».
          mv dist/windows "dist/markitdown_ui-$v-windows-x64"
          (cd dist && zip -qr "markitdown_ui-$v-windows-x64.zip" "markitdown_ui-$v-windows-x64")
          mv dist/android/app-release.apk "dist/markitdown_ui-$v-android-arm64.apk"
          ls -la dist

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "MarkItDown UI $v" \
            --notes-file .github/release-notes.md \
            "dist/markitdown_ui-$v-windows-x64.zip" \
            "dist/markitdown_ui-$v-android-arm64.apk"
