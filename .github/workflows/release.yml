name: Release

# Tag vX.Y.Z → a GitHub Release with ready-made builds for Windows and
# Android (docs/operations.md#release). The tag is placed on a commit in
# main, and the version in app/pubspec.yaml must match the tag — checked
# below.
#
#   git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ['v*']
  # A dry run without publishing — for when the release recipe itself
  # changes: otherwise a broken APK build would only be discovered after
  # tagging.
  pull_request:
    paths: ['.github/workflows/release.yml']

env:
  FLUTTER_VERSION: 3.32.8

jobs:
  # The same checks and the same Windows build (with the sidecar) as on
  # every push: the release is built with exactly what CI checks, not a
  # separate recipe.
  ci:
    uses: ./.github/workflows/ci.yml

  android:
    runs-on: ubuntu-24.04  # not ubuntu-latest — see verify in ci.yml
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: версия в pubspec совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | cut -d+ -f1)"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Тег v$tag, а в app/pubspec.yaml версия $version"
            exit 1
          fi

      # libpdfium.so in jniLibs/arm64-v8a — without it the APK builds, but
      # PDF fails at runtime (docs/operations.md#android).
      - name: PDFium
        run: ./pdfium/fetch.sh

      # Tesseract for OCR: libtesseract/libleptonica/libjpeg/libpngx.so in
      # jniLibs/arm64-v8a and the rus/eng models in assets/tessdata. Without
      # them the APK builds, but OCR is silently unavailable in it — checked
      # below.
      - name: Tesseract (модели и .so)
        run: ./tesseract/fetch.sh

      # Speech recognition (0.8): the .so is built from source with the same
      # NDK version as the app (whisper/versions.sh) — there's no prebuilt
      # one, unlike Tesseract4Android. Cache is by recipe hash.
      - uses: actions/cache@v6
        with:
          path: |
            whisper/cache
            app/android/app/src/main/jniLibs/arm64-v8a/*whisper*
            app/android/app/src/main/jniLibs/arm64-v8a/*ggml*
            app/android/app/src/main/jniLibs/arm64-v8a/.whisper-built-*
          key: whisper-android-arm64-${{ hashFiles('whisper/build.sh', 'whisper/versions.sh', 'whisper/shim/**') }}

      - uses: actions/cache@v6
        with:
          path: whisper/models
          key: whisper-models-${{ hashFiles('whisper/versions.sh') }}

      - name: whisper (NDK, сборка .so и модели)
        run: |
          ndk="$(sed -n 's/^ANDROID_NDK_VERSION="\(.*\)"/\1/p' whisper/versions.sh)"
          # (yes || true): under pipefail, yes getting SIGPIPE would fail the step with 141.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          ./whisper/build.sh --android
          ./whisper/fetch.sh

      # arm64 only: PDFium in the APK only exists for arm64-v8a, and there
      # are practically no other phones left. Signing uses the debug key
      # (that's how android/app/build.gradle.kts is configured — there's no
      # dedicated key yet).
      - name: flutter build apk
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      # Permissions are checked on the built APK, not just in the source
      # manifest: they also arrive from dependencies' manifests. As of 0.9
      # INTERNET is present ("link" mode, docs/offline-and-privacy.md); no
      # other networking permission — no network state, no Wi-Fi: the app
      # doesn't need them.
      - name: разрешения APK
        run: |
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)"
          "$aapt" dump permissions app/build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -qE 'android.permission.(ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)' permissions.txt; then
            echo "::error::APK запрашивает сетевое разрешение сверх INTERNET"
            exit 1
          fi

      - name: OCR и распознавание речи в APK
        run: |
          unzip -l app/build/app/outputs/flutter-apk/app-release.apk > apk.txt
          for f in lib/arm64-v8a/libtesseract.so lib/arm64-v8a/libleptonica.so \
                   assets/flutter_assets/assets/tessdata/rus.traineddata \
                   assets/flutter_assets/assets/tessdata/eng.traineddata \
                   lib/arm64-v8a/libmarkitdown_whisper.so lib/arm64-v8a/libwhisper.so \
                   lib/arm64-v8a/libggml-cpu-android_armv8.0_1.so \
                   assets/flutter_assets/assets/whisper/models.json \
                   assets/flutter_assets/assets/whisper/ggml-small-q8_0.bin; do
            grep -q "$f" apk.txt || { echo "::error::В APK нет $f"; exit 1; }
          done
          echo "APK: $(du -h app/build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: markitdown_ui-android-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    needs: [ci, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04  # not ubuntu-latest — see verify in ci.yml
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: markitdown_ui-windows-x64
          path: dist/windows

      - uses: actions/download-artifact@v8
        with:
          name: markitdown_ui-android-arm64
          path: dist/android

      # A Windows release without the sidecar isn't the right product (PDF
      # tables would silently disappear, xls/msg would fall back to the
      # degraded parser), so we fail rather than publish a crippled build.
      - name: файлы релиза
        run: |
          v="${GITHUB_REF_NAME#v}"
          test -f dist/windows/markitdown_ui.exe
          test -f dist/windows/pdfium.dll
          ls dist/windows/tesseract*.dll dist/windows/leptonica*.dll
          test -f dist/windows/data/flutter_assets/assets/tessdata/rus.traineddata
          test -f dist/windows/markitdown_whisper.dll
          test -f dist/windows/data/flutter_assets/assets/whisper/models.json
          test -f dist/windows/sidecar/manifest.json || {
            echo "::error::В Windows-сборке нет сайдкара"; exit 1; }
          # Inside the archive — a single folder, not a scattering of files in "Downloads".
          mv dist/windows "dist/markitdown_ui-$v-windows-x64"
          (cd dist && zip -qr "markitdown_ui-$v-windows-x64.zip" "markitdown_ui-$v-windows-x64")
          mv dist/android/app-release.apk "dist/markitdown_ui-$v-android-arm64.apk"
          ls -la dist

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "MarkItDown UI $v" \
            --notes-file .github/release-notes.md \
            "dist/markitdown_ui-$v-windows-x64.zip" \
            "dist/markitdown_ui-$v-android-arm64.apk"
