name: markitdown_core
description: >
  Конвейер конвертации файлов в Markdown. Чистый Dart, без зависимости от
  flutter: тестируется как dart test, уезжает в изолят, при необходимости
  становится CLI.
version: 0.8.0
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  archive: ^3.6.1
  csv: ^6.0.0
  xml: ^6.5.0
  html: ^0.15.4
  html2md: ^1.3.2
  ffi: ^2.1.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  path: ^1.9.0
